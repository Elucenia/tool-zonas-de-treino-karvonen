<!doctype html><!-- tool-zonas-de-treino-karvonen · Elucenia · Copyright (c) 2026 Elucenia · Felipe Guedes (fgxdev.com) · Apache-2.0 · https://github.com/Elucenia/tool-zonas-de-treino-karvonen --><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>Zonas de treino pela FC de reserva (Karvonen) · Elucenia</title><style>body{font:16px/1.6 system-ui,sans-serif;color:#14253a;background:#f4f7fa;max-width:900px;margin:auto;padding:32px}main{background:white;border:1px solid #d4dfe9;border-radius:16px;padding:24px}h1{line-height:1.2}label{display:block;margin:20px 0}input,select,button{font:inherit;padding:10px;border:1px solid #94a8bb;border-radius:6px}input,select{display:block;max-width:95%;width:320px}input[type=checkbox]{display:inline;width:auto}button{cursor:pointer;background:#006eff;color:white}button[type=reset]{background:white;color:#14253a}#result{padding:18px;background:#eef5ff}small{display:block;color:#475569}a{color:#005bcb}</style><main><p>Elucenia · código de integração</p><h1>Zonas de treino pela FC de reserva (Karvonen)</h1><p>Reprodução técnica de uma fórmula ou escore. Revisão clínica independente pendente. Leia <a href="README.md">condições, fontes e permissões</a>.</p><form id="form"></form><p id="error" role="alert" hidden></p><section id="result" role="status" hidden></section><p><a href="tool.json">Ficha e referências</a> · <a href="calculator.js">Código JavaScript</a> · <a href="examples.json">Casos de referência</a></p></main><script src="calculator.js"></script><script>
const api=window.EluceniaTool,form=document.querySelector('#form'),out=document.querySelector('#result'),err=document.querySelector('#error');
for(const[name,label,type,o={}]of api.metadata.fields){const wrap=document.createElement('label'),text=document.createElement('span');text.textContent=label.replace(/<[^>]*>/g,'');wrap.append(text);const el=document.createElement(type==='sel'||type==='radio'?'select':'input');el.name=name;el.id='field-'+name;if(type==='chk')el.type='checkbox';else if(type==='sel'||type==='radio'){el.append(new Option('Selecione',''));for(const[v,l]of Object.entries(o.opts||{}))el.append(new Option(String(l).replace(/<[^>]*>/g,''),v));el.required=!o.opt;}else{el.type='number';el.step='any';if(Number.isFinite(o.min))el.min=o.min;if(Number.isFinite(o.max))el.max=o.max;el.required=!o.opt;}wrap.append(el);if(o.unit){const unit=document.createElement('small');unit.textContent=o.unit;wrap.append(unit);}form.append(wrap);}
const submit=document.createElement('button');submit.type='submit';submit.textContent='Calcular';const reset=document.createElement('button');reset.type='reset';reset.textContent='Limpar';form.append(submit,reset);
for(const type of ['input','change','reset'])form.addEventListener(type,()=>{out.hidden=true;err.hidden=true;});
form.addEventListener('submit',event=>{event.preventDefault();out.hidden=true;err.hidden=true;if(!form.reportValidity())return;const input={};for(const[name,,type]of api.metadata.fields){const el=form.elements.namedItem(name);input[name]=type==='chk'?el.checked:el.value;}const result=api.calculate(input);if(result.error){err.textContent=result.error;err.hidden=false;return;}out.textContent=result.label+': '+result.main.join(' ')+' — resultado da fórmula; não constitui decisão clínica.';out.hidden=false;});
</script></html>
